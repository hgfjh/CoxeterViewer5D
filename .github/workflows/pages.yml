name: Deploy browser app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build and verify the static site
        env:
          COXETER_PAGES_CONFIGURED_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm build:pages
          pnpm verify:pages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the production build at the Pages subpath
        run: pnpm e2e:pages

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
