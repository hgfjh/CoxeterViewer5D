name: research-grade

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04  # Playwright 1.60 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python exact-math tools
        run: python -m pip install -r requirements-ci.txt

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Performance regression gate
        run: pnpm bench:timed:hard-gate

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timed-performance-report
          path: .benchmark-current/timed-browser-v1.json
          if-no-files-found: ignore

      - name: Playwright
        run: pnpm exec playwright test

      - name: Artifact manifests
        run: pnpm validate:artifact-manifest

      - name: Research-grade gate
        run: pnpm validate:research-grade
